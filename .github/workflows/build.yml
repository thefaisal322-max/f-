name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # API keys come from GitHub secrets (Settings > Secrets and variables > Actions).
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build compressed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FaisalAI-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Keeps one release whose APK link never changes:
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/FaisalAI.apk
      - name: Publish the APK download link
        # An APK that contains your keys is never published on the public link; it stays in the private Actions artifact.
        if: github.ref == 'refs/heads/main' && env.GEMINI_API_KEY == '' && env.CF_API_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FaisalAI.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk FaisalAI.apk \
            --title "Faisal AI Assistance (latest build)" \
            --notes "Built from commit $GITHUB_SHA." \
            --target "$GITHUB_SHA" --latest
